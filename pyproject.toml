[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recorder"
version = "0.1.0"
description = "Record a meeting's audio (call loopback + microphone) to mp3 with start/stop commands and no echo."
readme = "SPEC.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "lameenc>=1.7",
    "PyAudioWPatch>=0.2.12.7; sys_platform == 'win32'",
    "sounddevice>=0.4.6; sys_platform == 'darwin'",
    "catap>=0.6.1,<0.7; sys_platform == 'darwin' and python_version >= '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "packaging"]
transcribe = ["openai>=1.50", "miniaudio>=1.70"]

[project.scripts]
recorder = "recorder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
